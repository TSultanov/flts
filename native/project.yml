name: FLTS
options:
  bundleIdPrefix: com.TS
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "100"
    DEVELOPMENT_TEAM: Y7859GAXS2
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # The Rust core is built for the host arch only; universal is future work.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
targets:
  FLTS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Generated/flts_ffi.swift
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FLTS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSAppleEventsUsageDescription: FLTS reads what Spotify is playing to show translated lyrics.
        NSLocalNetworkUsageDescription: FLTS syncs your library with your other devices on the local network.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Resources/FLTS.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: FLTS
        PRODUCT_BUNDLE_IDENTIFIER: com.TS.FLTS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/core
        OTHER_LDFLAGS: -lflts_ffi -lresolv -framework SystemConfiguration -framework CoreServices -framework Security -framework IOKit
        DEAD_CODE_STRIPPING: true
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEPLOYMENT_POSTPROCESSING: true
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          # An app exports nothing; without this every Rust symbol lands in the
          # export trie. Release test runs clear it (tests link against the app).
          FLTS_NO_EXPORTS: -Wl,-exported_symbols_list,/dev/null
          OTHER_LDFLAGS: $(inherited) -lflts_ffi -lresolv -framework SystemConfiguration -framework CoreServices -framework Security -framework IOKit $(FLTS_NO_EXPORTS)
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: all
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then PROFILE=release-ship; else PROFILE=debug; fi
          "$PROJECT_DIR/scripts/build-core.sh" "$PROFILE"
    scheme:
      testTargets: [FLTSTests, FLTSUITests]
      environmentVariables:
        FLTS_CONFIG_DIR: /tmp/flts-dev
        FLTS_DISABLE_SYNC: "1"
        FLTS_KEYRING_SERVICE: FLTS-Spotify-dev
        RUST_BACKTRACE: "1"
  FLTS-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: Generated/flts_ffi.swift
      - path: iOS/Assets.xcassets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: FLTS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: FLTS uses the camera to scan another device's pairing QR code.
        NSLocalNetworkUsageDescription: FLTS syncs your library with your other devices on the local network.
    settings:
      base:
        PRODUCT_NAME: FLTS
        PRODUCT_BUNDLE_IDENTIFIER: com.TS.FLTS
        TARGETED_DEVICE_FAMILY: "1,2"
        # Above the Tauri iOS app's build (100), so this installs over it.
        CURRENT_PROJECT_VERSION: "101"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/build/core-ios-sim
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/build/core-ios
        OTHER_LDFLAGS: -lflts_ffi -lresolv -framework SystemConfiguration -framework Security
        DEAD_CODE_STRIPPING: true
    preBuildScripts:
      - name: Build Rust core
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then PROFILE=release-ship; else PROFILE=debug; fi
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then CORE=ios-sim; else CORE=ios; fi
          "$PROJECT_DIR/scripts/build-core.sh" "$PROFILE" "$CORE"
    scheme:
      testTargets: [FLTSiOSUITests]
  FLTSiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests-iOS]
    dependencies:
      - target: FLTS-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FLTS-iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.TS.FLTS.uitests
  FLTSTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: FLTS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FLTS.app/Contents/MacOS/FLTS
  FLTSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: FLTS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: FLTS
schemes:
  FLTS (Real Data):
    build:
      targets:
        FLTS: all
    run:
      config: Debug
      environmentVariables:
        RUST_BACKTRACE: "1"
    archive:
      config: Release
