[package]
name = "e2e-sims"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "flts-e2e-sims"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

[dev-dependencies]
reqwest = { workspace = true }
# Same crates (and versions) the app decodes these protocols with: the tests
# pin the sim's response shapes against the real deserializers.
async-openai = { version = "0.34.0", features = ["_api", "chat-completion", "chat-completion-types"] }
gemini-rust = "1.7.1"
