[package]
name = "app-core"
version = "0.1.0"
edition = "2024"

[features]
manual-llm-diagnostics = ["library/manual-llm-diagnostics"]
# Test-only entry points the E2E bridge drives.
e2e-bridge = []

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
library = { path = "../library", features = ["sync-engine"] }
log = { workspace = true }
isolang = { workspace = true, features = [
  "list_languages",
  "local_names",
  "serde",
] }
directories = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1.92"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "fs",
  "time",
  "io-util",
  "process",
] }
uuid = { workspace = true }
htmlentity = "1.3.2"
reqwest = { workspace = true }
sha2 = "0.11"
base64 = "0.23"
keyring = "4"
webbrowser = "1"
rand = { workspace = true }
gethostname = "1"
# CDP WebSocket client for the Spotify lyrics bridge (app/spotify/cdp.rs).
tokio-tungstenite = "0.30"
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
# keyring 4's v1 mode enables the Apple store without `protected`, which the
# store requires on iOS.
apple-native-keyring-store = { version = "1", features = ["protected"] }

[dev-dependencies]
tempfile = "3"
