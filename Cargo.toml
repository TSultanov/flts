[package]
name = "dbsync"
version = "0.1.0"
edition = "2024"
exclude = ["dbsync-macros", "scripts", ".cargo"]

[workspace]
members = ["dbsync-macros"]
default-members = [".", "dbsync-macros"]

[features]
default = ["macros"]
macros = ["dep:dbsync-macros"]

[dependencies]
dbsync-macros = { version = "0.1.0", path = "dbsync-macros", optional = true }
rand = "0.9"
sha1 = "0.11.0"
zstd = { version = "0.14", default-features = false }

[[example]]
name = "library"
required-features = ["macros"]

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }

[[example]]
name = "store_bench"
required-features = ["macros"]

[[example]]
name = "library_migration"
required-features = ["macros"]
