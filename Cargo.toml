[workspace]
resolver = "3"
members = [
  "app-core",
  "cli",
  "e2e-sims",
  "library",
  "site/src-tauri",
  "sync-harness",
  "syncthing-sys",
]
# Keeps its own workspace: its pinned proptest env in dbsync/.cargo only
# applies to runs started inside dbsync/.
exclude = ["dbsync"]

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0.102"
directories = "6.0.0"
isolang = "2.4.0"
log = "0.4.29"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = "1.52.3"
unicode-normalization = "0.1.24"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
panic = "abort"
strip = "symbols"

# Stripped proc-macro dylibs fail to load on current macOS ("mis-aligned
# LINKEDIT string pool"); build scripts and proc macros keep their symbols.
[profile.release.build-override]
strip = "none"

[profile.release-ship]
inherits = "release"
lto = "fat"
codegen-units = 1
