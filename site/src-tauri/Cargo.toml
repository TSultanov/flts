[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
manual-llm-diagnostics = ["app-core/manual-llm-diagnostics"]
# Opt-in only. Never enable by default or in ship builds: it exposes the whole
# invoke surface over a local socket.
e2e-bridge = ["dep:axum", "tokio/net", "app-core/e2e-bridge"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
app-core = { path = "../../app-core" }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
log = { workspace = true }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-os = "2.4.0"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.5.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Camera QR scanning for device pairing (mobile only).
tauri-plugin-barcode-scanner = "2"

[dev-dependencies]
tempfile = "3"
