# Run `scripts/install-git-hooks.sh` once after cloning to enable hooks.
#
# Formatters run on staged files before each commit. Vendored and generated
# paths are excluded via `exclude` and `.prettierignore`.

default_language_version:
  node: "22.14.0"

exclude: |
  (?x)^(
    syncthing-core/webui-vendor/|
    site/src-tauri/gen/|
    site/pnpm-lock\.yaml
  )

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

  - repo: local
    hooks:
      - id: prettier
        # The workspace's own prettier, not a pre-commit-managed copy: Prettier
        # resolves plugins from the CWD, so `prettier-plugin-svelte` is only
        # findable via site/node_modules (see .prettierrc.json). Needs
        # `pnpm install` in site/ first, which anyone editing these files has.
        name: prettier
        entry: site/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: \.(css|html?|json|md|ya?ml|jsx?|tsx?|svelte)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: [-i, "4", -ci, -bn]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
