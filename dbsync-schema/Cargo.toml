[package]
name = "dbsync-schema"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", default-features = false, features = [
    "parsing",
    "printing",
    "proc-macro",
    "derive",
    "clone-impls",
    "extra-traits",
] }
